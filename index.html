  <style>

    :root{

    }

    .card{

    .card-title{

    .gps-box{

      color:#111;

    .btn:disabled{

      opacity:.45;

    .distance{

    .distance.ok{

    .photo-box{

    .photo-placeholder{

    }

    .camera-btn{

    input[type=file]{

    }

    .small-note{

      color:#999;

      background:var(--green);

      padding:18px;

      rgba(24,173,121,.20);

    .message{

      margin-top:13px;

      border-radius:17px;

      font-weight:700;

    }

    .message.ok{

      display:block;

      background:#eaf9f3;

      color:#107352;

    }

    .message.error{

      display:block;

    }

    .loading{

      display:none;

      position:fixed;

      inset:0;

      z-index:9999;

      background:
      rgba(255,255,255,.92);

      align-items:center;

      justify-content:center;

      text-align:center;

    }

    .loading.show{

      display:flex;

    }

    .loading-card{

      background:#fff;

      padding:26px;

      border-radius:25px;

      box-shadow:
      0 15px 45px
      rgba(0,0,0,.15);

    }

    .spinner{

      width:45px;

      height:45px;

      border:
      4px solid
      #eee;

      border-top-color:#111;

      border-radius:50%;

      margin:
      0 auto
      15px;

      animation:
      spin .8s linear infinite;

    }

    @keyframes spin{

      to{
        transform:
        rotate(360deg);
      }

    }

  </style>

</head>

<body>


<div class="wrap">

    <div class="eyebrow">
      SLAY ROIET · STAFF ATTENDANCE
    </div>

    <h1>
      เช็คชื่อเข้างาน
    </h1>

    <div class="sub">
      LINE + พิกัด + รูปถ่ายปัจจุบัน
    </div>


    <div class="profile">

      <img
        id="avatar"
        class="avatar"

<!--
ส่ง POST ไป Apps Script
-->
<iframe
  id="gasFrame"
  name="gasFrame"
  style="display:none"
></iframe>



<script>


/*************************************************
 * CONFIG
 *************************************************/


const LIFF_ID =
'2009168820-J1uzUVLZ';


const GAS_WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbzMf1s3RGCWeJpA-LjX5EmjfE47WSylj1dCTkG7MFdv7Ta_7iZ19lWXENRqnZ-Guc4/exec';


// SLAY ROIET

const OFFICE_LAT =
16.0680965;

const OFFICE_LNG =
103.6506075;


// ระยะอนุญาต

const MAX_DISTANCE_M =
200;



/*************************************************
 * STATE
 *************************************************/


let idToken =
'';


let lineProfile =
null;


let currentLocation =
null;


let compressedImage =
'';



const $ =
id =>
document.getElementById(id);



/*************************************************
 * INIT LIFF
 *************************************************/


window.addEventListener(
'load',
initLiff
);



async function initLiff(){

  try{


    $('lineState').textContent =
    'กำลังเชื่อมต่อ LINE...';


    await liff.init({

      liffId:
      LIFF_ID

    });


    if(
      !liff.isLoggedIn()
    ){

      liff.login({

        redirectUri:
        window.location.href

      });

      return;

    }



    idToken =
    liff.getIDToken();



    if(
      !idToken
    ){

      throw new Error(
        'ไม่ได้รับ LINE ID Token'
      );

    }



    lineProfile =
    await liff.getProfile();



    $('displayName').textContent =

    lineProfile.displayName ||

    'LINE User';



    $('lineState').textContent =

    'เชื่อมต่อ LINE สำเร็จ ✓';



    if(
      lineProfile.pictureUrl
    ){

      $('avatar').src =
      lineProfile.pictureUrl;

    }



    getLocation();


    updateButton();


  }

  catch(error){


    console.error(
      error
    );


    $('displayName').textContent =
    'เชื่อมต่อ LINE ไม่สำเร็จ';


    $('lineState').textContent =

    error.message ||

    String(error);


    showError(

      'LIFF ERROR: ' +

      (
        error.message ||

        error
      )

    );

  }

}



/*************************************************
 * LOCATION
 *************************************************/


function getLocation(){


  if(
    !navigator.geolocation
  ){

    showError(
      'อุปกรณ์นี้ไม่รองรับ Location'
    );

    return;

  }



  $('locationBtn').disabled =
  true;


  $('gpsTitle').textContent =
  'กำลังค้นหาพิกัด...';



  navigator.geolocation
  .getCurrentPosition(


    position => {


      currentLocation = {

        latitude:
        Number(
          position.coords.latitude
        ),

        longitude:
        Number(
          position.coords.longitude
        ),

        accuracy:
        Number(
          position.coords.accuracy || 0
        )

      };



      $('gpsTitle').textContent =

      'ได้รับพิกัดแล้ว ✓';



      $('gpsDetail').textContent =

      currentLocation
      .latitude
      .toFixed(6)

      + ', '

      + currentLocation
      .longitude
      .toFixed(6)

      + ' · แม่นยำประมาณ '

      + Math.round(
          currentLocation.accuracy
        )

      + ' ม.';



      const distance =

      calculateDistance(

        currentLocation.latitude,

        currentLocation.longitude,

        OFFICE_LAT,

        OFFICE_LNG

      );



      if(
        distance <=
        MAX_DISTANCE_M
      ){


        $('distanceText')
        .className =

        'distance ok';



        $('distanceText')
        .textContent =

        '✓ อยู่ในพื้นที่เช็คอิน · ห่างประมาณ '

        + Math.round(
            distance
          )

        + ' เมตร';


      }

      else{


        $('distanceText')
        .className =

        'distance bad';



        $('distanceText')
        .textContent =

        '✕ อยู่นอกพื้นที่ · ห่างประมาณ '

        + Math.round(
            distance
          )

        + ' เมตร';


      }



      $('locationBtn').disabled =
      false;


      updateButton();

    },


    error => {


      $('locationBtn').disabled =
      false;


      showError(

        'ไม่สามารถรับพิกัดได้ กรุณาอนุญาต Location'

      );

    },


    {

      enableHighAccuracy:
      true,

      timeout:
      20000,

      maximumAge:
      0

    }

  );

}



/*************************************************
 * CAMERA
 *************************************************/


$('cameraInput')
.addEventListener(

'change',

async event => {


  const file =

  event.target.files &&

  event.target.files[0];



  if(
    !file
  ){

    return;

  }



  try{


    compressedImage =

    await compressImage(

      file,

      1000,

      0.68

    );



    $('photoPreview').src =

    compressedImage;



    $('photoPreview')
    .style.display =

    'block';



    $('photoPlaceholder')
    .style.display =

    'none';



    updateButton();


  }

  catch(error){


    showError(

      'เตรียมรูปไม่สำเร็จ'

    );

  }

});



/*************************************************
 * SUBMIT
 *************************************************/


async function submitCheckin(){


  clearMessage();



  if(
    !idToken
  ){

    showError(
      'ยังไม่ได้เชื่อมต่อ LINE'
    );

    return;

  }



  if(
    !currentLocation
  ){

    showError(
      'กรุณารับพิกัดก่อน'
    );

    return;

  }



  if(
    !compressedImage
  ){

    showError(
      'กรุณาถ่ายรูปก่อน'
    );

    return;

  }



  const distance =

  calculateDistance(

    currentLocation.latitude,

    currentLocation.longitude,

    OFFICE_LAT,

    OFFICE_LNG

  );



  if(

    MAX_DISTANCE_M > 0

    &&

    distance >
    MAX_DISTANCE_M

  ){

    showError(

      'คุณอยู่นอกพื้นที่เช็คอิน '

      + Math.round(
          distance
        )

      + ' เมตร'

    );

    return;

  }



  /*************************************************
   * LOADING
   *************************************************/


  setLoading(
    true
  );


  $('checkinBtn').disabled =
  true;



  /*************************************************
   * ส่งข้อมูลไป Apps Script
   *************************************************/


  sendToBackend();



  /*************************************************
   * รอ Apps Script บันทึก
   *************************************************/


  await wait(
    1800
  );



  /*************************************************
   * USER ส่ง FLEX
   *************************************************/


  try{


    await sendCheckinFlex(
      distance
    );



    showSuccess(

      '✅ เช็คอินสำเร็จ<br>' +

      'ส่งข้อมูลเข้าแชตเรียบร้อยแล้ว'

    );



    $('checkinBtn').textContent =

    '✓ เช็คอินเรียบร้อย';



    /*************************************************
     * CLOSE LIFF
     *************************************************/


    await wait(
      900
    );


    if(
      liff.isInClient()
    ){

      liff.closeWindow();

    }


  }

  catch(error){


    console.error(
      error
    );


    setLoading(
      false
    );


    showError(

      'บันทึกสำเร็จ แต่ส่ง Flex ไม่สำเร็จ<br>' +

      (
        error.message ||

        error
      )

    );


    $('checkinBtn').disabled =
    false;

  }

}



/*************************************************
 * SEND BACKEND
 *************************************************/


function sendToBackend(){


  const form =

  document.createElement(
    'form'
  );


  form.method =
  'POST';


  form.action =
  GAS_WEB_APP_URL;


  form.target =
  'gasFrame';


  form.style.display =
  'none';



  const data = {


    action:
    'saveAttendance',


    idToken:
    idToken,


    latitude:
    currentLocation.latitude,


    longitude:
    currentLocation.longitude,


    accuracy:
    currentLocation.accuracy,


    imageDataUrl:
    compressedImage

  };



  Object
  .entries(
    data
  )
  .forEach(

    ([key,value]) => {


      const input =

      document.createElement(
        'input'
      );


      input.type =
      'hidden';


      input.name =
      key;


      input.value =
      String(
        value
      );


      form.appendChild(
        input
      );

    }

  );



  document.body
  .appendChild(
    form
  );


  form.submit();



  setTimeout(

    () => {

      try{

        form.remove();

      }
      catch(e){}

    },

    5000

  );

}



/*************************************************
 * SEND FLEX BY USER
 *************************************************/


async function sendCheckinFlex(
distance
){


  if(
    !liff.isInClient()
  ){

    throw new Error(
      'ต้องเปิดผ่านแอป LINE'
    );

  }



  const now =

  new Date();



  const date =

  now.toLocaleDateString(

    'th-TH',

    {

      day:
      '2-digit',

      month:
      '2-digit',

      year:
      'numeric'

    }

  );



  const time =

  now.toLocaleTimeString(

    'th-TH',

    {

      hour:
      '2-digit',

      minute:
      '2-digit',

      second:
      '2-digit',

      hour12:
      false

    }

  );



  const mapUrl =

  'https://www.google.com/maps?q='

  + currentLocation.latitude

  + ','

  + currentLocation.longitude;



  const name =

  lineProfile.displayName ||

  'พนักงาน';



  const flex = {


    type:
    'flex',


    altText:

    '✅ '

    + name

    + ' เช็คอินเข้างานแล้ว',



    contents: {


      type:
      'bubble',



      size:
      'mega',



      header: {


        type:
        'box',


        layout:
        'vertical',


        paddingAll:
        '20px',


        backgroundColor:
        '#111111',


        contents: [


          {

            type:
            'text',

            text:
            'SLAY ROIET',

            color:
            '#AAAAAA',

            size:
            'sm',

            weight:
            'bold'

          },


          {

            type:
            'text',

            text:
            'CHECK IN ✓',

            color:
            '#FFFFFF',

            size:
            'xxl',

            weight:
            'bold',

            margin:
            'sm'

          },


          {

            type:
            'text',

            text:
            'บันทึกเวลาเข้างานเรียบร้อย',

            color:
            '#BBBBBB',

            size:
            'sm',

            margin:
            'sm'

          }

        ]

      },



      body: {


        type:
        'box',


        layout:
        'vertical',


        spacing:
        'md',


        paddingAll:
        '20px',


        contents: [


          flexRow(

            'ชื่อ',

            name

          ),


          flexRow(

            'วันที่',

            date

          ),


          flexRow(

            'เวลา',

            time

          ),


          flexRow(

            'GPS',

            '±'

            + Math.round(
                currentLocation.accuracy
              )

            + ' ม.'

          ),


          flexRow(

            'ระยะจากร้าน',

            Math.round(
              distance
            )

            + ' ม.'

          ),


          {

            type:
            'separator',

            margin:
            'md'

          },


          {

            type:
            'text',

            text:
            '✅ อยู่ในพื้นที่เช็คอิน',

            color:
            '#18AD79',

            weight:
            'bold',

            size:
            'sm',

            margin:
            'md'

          }

        ]

      },



      footer: {


        type:
        'box',


        layout:
        'vertical',


        paddingAll:
        '16px',


        contents: [


          {

            type:
            'button',


            style:
            'primary',


            color:
            '#111111',


            action: {


              type:
              'uri',


              label:
              'ดูพิกัดบนแผนที่',


              uri:
              mapUrl

            }

          }

        ]

      }

    }

  };



  await liff.sendMessages(

    [
      flex
    ]

  );

}



/*************************************************
 * FLEX ROW
 *************************************************/


function flexRow(
label,
value
){


  return {


    type:
    'box',


    layout:
    'horizontal',


    contents: [


      {

        type:
        'text',

        text:
        String(
          label
        ),

        color:
        '#777777',

        size:
        'sm',

        flex:
        4

      },


      {

        type:
        'text',

        text:
        String(
          value
        ),

        color:

}



/*************************************************
 * COMPRESS IMAGE
 *************************************************/


function compressImage(
file,
maxSide,
quality
){


  return new Promise(

    (
      resolve,
      reject
    ) => {


      const image =
      new Image();


      const reader =
      new FileReader();



      reader.onload =

      event => {


        image.onload =

        () => {


          let width =
          image.naturalWidth;


          let height =
          image.naturalHeight;



          const scale =

          Math.min(

            1,

            maxSide /

            Math.max(
              width,
              height
            )

          );



          width =
          Math.round(
            width *
            scale
          );


          height =
          Math.round(
            height *
            scale
          );



          const canvas =

          document.createElement(
            'canvas'
          );


          canvas.width =
          width;


          canvas.height =
          height;



          const context =

          canvas.getContext(
            '2d'
          );



          context.drawImage(

            image,

            0,

            0,

            width,

            height

          );



          resolve(

            canvas.toDataURL(

              'image/jpeg',

              quality

            )

          );

        };



        image.onerror =

        () => {

          reject(

            new Error(
              'อ่านรูปไม่ได้'
            )

          );

        };



        image.src =
        event.target.result;

      };



      reader.onerror =

      () => {

        reject(

          new Error(
            'อ่านไฟล์ไม่ได้'
          )

        );

      };



      reader.readAsDataURL(
        file
      );

    }

  );

}



/*************************************************
 * DISTANCE
 *************************************************/


function calculateDistance(
lat1,
lng1,
lat2,
lng2
){


  const R =
  6371000;


  const rad =

  value =>

  value *
  Math.PI /
  180;



  const p1 =
  rad(lat1);


  const p2 =
  rad(lat2);


  const dp =
  rad(
    lat2 -
    lat1
  );


  const dl =
  rad(
    lng2 -
    lng1
  );



  const a =

  Math.sin(
    dp / 2
  ) ** 2

  +

  Math.cos(p1)

  *

  Math.cos(p2)

  *

  Math.sin(
    dl / 2
  ) ** 2;



  return

  R *

  2 *

  Math.atan2(

    Math.sqrt(a),

    Math.sqrt(
      1 - a
    )

  );

}

 *************************************************/


function wait(ms){


  return new Promise(

    resolve =>

    setTimeout(
      resolve,
      ms
    )

  );

}

status
){


  $('loading')

  .toggle(

  );

message
){

  $('message').className =

}



function showError(
message
){


  setLoading(
    false
  );

  'message error';

}
