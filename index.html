<!DOCTYPE html>

<head>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:#f4f4f4;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  "Noto Sans Thai",

  color:#111;

}

.wrap{

  max-width:560px;

  margin:auto;

  padding:16px 14px 40px;

}


/*****************************************
 * HEADER
 *****************************************/

.header{

  background:
  linear-gradient(
    145deg,
    #0d0d0d,
    #191919
  );

  color:#fff;

  border-radius:26px;

  padding:23px;

  box-shadow:
  0 15px 35px
  rgba(0,0,0,.14);

}

.brand{

  color:#ff668e;

  font-size:11px;

  letter-spacing:2px;

  font-weight:900;

}

h1{

  margin:7px 0 4px;

  font-size:29px;

}

.subtitle{

  color:#aaa;

  font-size:13px;

}

.profile{

  margin-top:20px;

  display:flex;

  align-items:center;

  gap:12px;

}

.avatar{

  width:52px;

  height:52px;

  border-radius:50%;

  background:#333;

  object-fit:cover;

}

.name{

  font-size:17px;

  font-weight:900;

}

.state{

  color:#aaa;

  font-size:12px;

  margin-top:4px;

}


/*****************************************
 * SHIFT
 *****************************************/

.shift-card{

  margin-top:14px;

  border-radius:20px;

  padding:15px;

  background:#fff;

  display:none;

  box-shadow:
  0 7px 24px
  rgba(0,0,0,.05);

}

.shift-card.show{

  display:block;

}

.shift-label{

  font-size:11px;

  color:#999;

  font-weight:700;

}

.shift-time{

  font-size:21px;

  margin-top:3px;

  font-weight:900;

}

.shift-working{

  color:#14815b;

  font-size:12px;

  margin-top:5px;

  font-weight:800;

}


/*****************************************
 * CARDS
 *****************************************/

.card{

  background:#fff;

  margin-top:14px;

  padding:18px;

  border-radius:23px;

  box-shadow:
  0 7px 25px
  rgba(0,0,0,.05);

}

.title{

  font-size:18px;

  font-weight:900;

  margin-bottom:14px;

}


/*****************************************
 * GPS
 *****************************************/

.gps{

  border:1px solid #e7e7e7;

  border-radius:17px;

  padding:14px;

  display:flex;

  gap:12px;

  align-items:center;

}

.gps-icon{

  width:44px;

  height:44px;

  border-radius:14px;

  background:#eaf9f3;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-shrink:0;

}

.gps-title{

  font-size:14px;

  font-weight:900;

}

.gps-detail{

  font-size:11px;

  color:#777;

  margin-top:4px;

}

.distance{

  margin-top:10px;

  font-size:12px;

  font-weight:800;

}

.distance.ok{

  color:#14815b;

}

.distance.bad{

  color:#c61f28;

}


/*****************************************
 * BUTTON
 *****************************************/

.btn{

  width:100%;

  border:0;

  padding:15px;

  border-radius:16px;

  font-size:16px;

  font-weight:900;

  font-family:inherit;

}

.btn:disabled{

  opacity:.45;

}

.location-btn{

  margin-top:12px;

  background:#eee;

}


/*****************************************
 * PHOTO
 *****************************************/

.photo{

  width:100%;

  aspect-ratio:4/3;

  border-radius:20px;

  overflow:hidden;

  background:#eee;

  display:flex;

  align-items:center;

  justify-content:center;

}

.photo img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:none;

}

.photo-text{

  color:#888;

  text-align:center;

  font-size:14px;

}

.camera{

  display:block;

  padding:15px;

  margin-top:12px;

  background:#111;

  color:#fff;

  border-radius:16px;

  text-align:center;

  font-weight:900;

}

input[type=file]{

  display:none;

}


/*****************************************
 * ACTION
 *****************************************/

.action{

  margin-top:15px;

  padding:19px;

  color:#fff;

  font-size:18px;

  border-radius:20px;

}

.action.checkin{

  background:#18ad79;

}

.action.checkout{

  background:#b81746;

}


/*****************************************
 * MESSAGE
 *****************************************/

.message{

  display:none;

  margin-top:13px;

  border-radius:16px;

  padding:14px;

  font-weight:800;

}

.message.error{

  display:block;

  background:#fff0f0;

  color:#bb1e26;

}


/*****************************************
 * LOADING
 *****************************************/

.loading{

  position:fixed;

  inset:0;

  display:none;

  justify-content:center;

  align-items:center;

  background:
  rgba(255,255,255,.93);

  z-index:9999;

}

.loading.show{

  display:flex;

}

.loading-card{

  width:270px;

  background:#fff;

  padding:28px;

  border-radius:26px;

  text-align:center;

  box-shadow:
  0 15px 45px
  rgba(0,0,0,.16);

}

.spinner{

  width:45px;

  height:45px;

  border:4px solid #eee;

  border-top-color:#b81746;

  border-radius:50%;

  margin:0 auto 15px;

  animation:spin .8s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

</style>

</head>



<body>


<div class="wrap">


<section class="header">

  <div class="brand">
    SLAY ROIET · STAFF
  </div>

  <h1>
    เช็คชื่อเข้างาน
  </h1>

  <div class="subtitle">
    ระบบลงเวลาเข้า–ออกงาน
  </div>


  <div class="profile">

    <img
      id="avatar"
      class="avatar"
    >

    <div>

      <div
        id="displayName"
        class="name"
      >
        กำลังเชื่อมต่อ LINE...
      </div>

      <div
        id="lineState"
        class="state"
      >
        กรุณารอสักครู่
      </div>

    </div>

  </div>

</section>



<div
  id="shiftCard"
  class="shift-card"
>

  <div class="shift-label">
    กำลังทำงาน
  </div>

  <div
    id="shiftTime"
    class="shift-time"
  >
    -
  </div>

  <div class="shift-working">
    ● ยังไม่ได้ลงเวลาออก
  </div>

</div>



<section class="card">

  <div class="title">
    1. ยืนยันตำแหน่ง
  </div>

  <div class="gps">

    <div class="gps-icon">
      📍
    </div>

    <div>

      <div
        id="gpsTitle"
        class="gps-title"
      >
        ยังไม่ได้รับตำแหน่ง
      </div>

      <div
        id="gpsDetail"
        class="gps-detail"
      >
        กรุณาอนุญาต Location
      </div>

    </div>

  </div>


  <button
    id="locationBtn"
    class="btn location-btn"
    onclick="getLocation()"
  >
    ใช้ตำแหน่งปัจจุบัน
  </button>


  <div
    id="distanceText"
    class="distance"
  ></div>

</section>



<section class="card">

  <div
    id="photoTitle"

  >

  </div>


  <div class="photo">

    <div
      id="photoText"
      class="photo-text"
    >
      📷
      <br>

    </div>

    <img
      id="photoPreview"
    >

  </div>


  <label

  >

  </label>


  <input

</section>



<button
  id="actionBtn"
  class="btn action checkin"
  onclick="submitAttendance()"

>
  ✅ เช็คชื่อเข้างาน
</button>


<div
  id="message"
  class="message"
></div>


</div>



<div
  id="loading"
  class="loading"
>

  <div class="loading-card">

    <div class="spinner"></div>

    <div
      id="loadingTitle"
      style="
      font-weight:900;
      font-size:17px;
      "
    >
      กำลังบันทึก...
    </div>

    <div
      id="loadingDetail"
      style="
      font-size:12px;
      color:#777;
      margin-top:6px;
      "
    >
      กรุณารอสักครู่
    </div>

  </div>

</div>



<iframe
  name="gasFrame"
  style="display:none"
></iframe>



<script>

/*************************************************
 * CONFIG
 *************************************************/

const LIFF_ID =
'2009168820-J1uzUVLZ';


const GAS_URL =
'https://script.google.com/macros/s/AKfycbzMf1s3RGCWeJpA-LjX5EmjfE47WSylj1dCTkG7MFdv7Ta_7iZ19lWXENRqnZ-Guc4/exec';


const OFFICE_LAT =
16.143207;


const OFFICE_LNG =
103.659470;


const MAX_DISTANCE_M =
200;


const LIFF_URL =
'https://liff.line.me/2009168820-J1uzUVLZ';



/*************************************************
 * STATE
 *************************************************/

let idToken = '';

let profile = null;

let locationData = null;

let imageData = '';

let mode = 'checkin';

let currentShift = null;

let submitting = false;


const $ =
id =>
document.getElementById(id);



/*************************************************
 * INIT
 *************************************************/

window.addEventListener(
  'load',
  init
);


async function init(){

  try{

    await liff.init({
      liffId:LIFF_ID
    });


    if(
      !liff.isLoggedIn()
    ){

      liff.login({
        redirectUri:
        window.location.href
      });

      return;

    }


    idToken =
      liff.getIDToken();


    profile =
      await liff.getProfile();


    $('displayName').textContent =
      profile.displayName ||
      'LINE User';


    $('lineState').textContent =
      'เชื่อมต่อ LINE แล้ว ✓';


    if(
      profile.pictureUrl
    ){

      $('avatar').src =
        profile.pictureUrl;

    }


    await loadStatus();


    getLocation();

  }

  catch(error){

    showError(
      'LINE ERROR: ' +
      (
        error.message ||
        error
      )
    );

  }

}



/*************************************************
 * STATUS
 *************************************************/

async function loadStatus(){

  setLoading(
    true,
    'กำลังตรวจสอบสถานะ...',
    'กำลังดูเวลาเข้า–ออก'
  );


  try{

    const result =
      await jsonp({

        action:
          'status',

        idToken:
          idToken

      });


    if(
      !result.ok
    ){

      throw new Error(
        result.message ||
        'ตรวจสอบสถานะไม่สำเร็จ'
      );

    }


    mode =
      result.mode ||
      'checkin';


    if(
      mode ===
      'checkout'
    ){

      currentShift =
        result;


      $('shiftCard')
        .classList
        .add(
          'show'
        );


      $('shiftTime').textContent =
        'เข้างาน ' +
        (
          result.checkInTime ||
          '-'
        );


      $('photoTitle').textContent =
        '2. ถ่ายรูปก่อนลงเวลาออก';


      $('actionBtn').textContent =
        '⏰ ลงเวลาออก';


      $('actionBtn')
        .classList
        .remove(
          'checkin'
        );


      $('actionBtn')
        .classList
        .add(
          'checkout'
        );

    }

    else{

      currentShift =
        null;


      $('shiftCard')
        .classList
        .remove(
          'show'
        );


      $('photoTitle').textContent =
        '2. ถ่ายรูปยืนยัน';


      $('actionBtn').textContent =
        '✅ เช็คชื่อเข้างาน';


      $('actionBtn')
        .classList
        .remove(
          'checkout'
        );


      $('actionBtn')
        .classList
        .add(
          'checkin'
        );

    }


    updateButton();

  }

  catch(error){

    showError(
      error.message ||
      error
    );

  }

  finally{

    setLoading(
      false
    );

  }

}



/*************************************************
 * GPS
 *************************************************/

function getLocation(){

  if(
    !navigator.geolocation
  ){

    showError(
      'อุปกรณ์ไม่รองรับ Location'
    );

    return;

  }


  $('gpsTitle').textContent =
    'กำลังค้นหาตำแหน่ง...';


  navigator
  .geolocation
  .getCurrentPosition(

    position => {

      locationData = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        accuracy:
          position.coords.accuracy ||
          0

      };


      $('gpsTitle').textContent =
        'ยืนยันตำแหน่งแล้ว ✓';


      $('gpsDetail').textContent =

        locationData.latitude
        .toFixed(6)

        + ', '

        + locationData.longitude
        .toFixed(6);


      const d =
        distanceMeters(

          locationData.latitude,

          locationData.longitude,

          OFFICE_LAT,

          OFFICE_LNG

        );


      if(
        d <=
        MAX_DISTANCE_M
      ){

        $('distanceText').className =
          'distance ok';


        $('distanceText').textContent =
          '✓ อยู่ในพื้นที่ลงเวลา';

      }

      else{

        $('distanceText').className =
          'distance bad';


        $('distanceText').textContent =
          '✕ อยู่นอกพื้นที่ลงเวลา';

      }


      updateButton();

    },

    error => {

      showError(
        'ไม่สามารถรับตำแหน่งได้ กรุณาอนุญาต Location'
      );

    },

    {

      enableHighAccuracy:
        true,

      timeout:
        20000,

      maximumAge:
        0

    }

  );

}



/*************************************************
 * CAMERA
 *************************************************/

$('camera')
.addEventListener(

  'change',

  async event => {

    const file =
      event.target.files &&
      event.target.files[0];


    if(
      !file
    ){
      return;
    }


    try{

      imageData =
        await compressImage(
          file
        );


      $('photoPreview').src =
        imageData;


      $('photoPreview').style.display =
        'block';


      $('photoText').style.display =
        'none';


      updateButton();

    }

    catch(error){

      showError(
        'เตรียมรูปไม่สำเร็จ'
      );

    }

  }

);



/*************************************************
 * SUBMIT
 *************************************************/

async function submitAttendance(){

  if(
    submitting
  ){
    return;
  }


  if(
    !locationData
  ){

    showError(
      'กรุณายืนยันตำแหน่ง'
    );

    return;

  }


  if(
    !imageData
  ){

    showError(
      'กรุณาถ่ายรูป'
    );

    return;

  }


  const distance =
    distanceMeters(

      locationData.latitude,

      locationData.longitude,

      OFFICE_LAT,

      OFFICE_LNG

    );


  if(
    distance >
    MAX_DISTANCE_M
  ){

    showError(
      'อยู่นอกพื้นที่ลงเวลา'
    );

    return;

  }


  submitting =
    true;


  updateButton();


  setLoading(

    true,

    mode ===
    'checkin'

    ? 'กำลังลงเวลาเข้างาน...'

    : 'กำลังลงเวลาออก...',

    'กำลังอัปโหลดรูปและบันทึกข้อมูล'

  );


  const requestId =
    createRequestId();


  try{

    sendPost(
      requestId
    );


    const result =
      await waitForResult(
        requestId
      );


    if(
      !result.ok
    ){

      throw new Error(
        result.message ||
        'บันทึกไม่สำเร็จ'
      );

    }


    $('loadingTitle').textContent =
      'บันทึกเรียบร้อย ✓';


    $('loadingDetail').textContent =
      'กำลังส่ง Flex เข้าแชต';


    await sendFlex(
      result
    );


    $('loadingTitle').textContent =
      mode === 'checkin'

      ? 'ลงเวลาเข้างานสำเร็จ ✓'

      : 'ลงเวลาออกสำเร็จ ✓';


    $('loadingDetail').textContent =
      'กำลังปิดหน้าต่าง...';


    await wait(
      800
    );


    if(
      liff.isInClient()
    ){

      liff.closeWindow();

    }

    else{

      setLoading(
        false
      );

    }

  }

  catch(error){

    submitting =
      false;


    setLoading(
      false
    );


    updateButton();


    showError(
      error.message ||
      error
    );

  }

}



/*************************************************
 * POST
 *************************************************/

function sendPost(
  requestId
){

  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    GAS_URL;


  form.target =
    'gasFrame';


  form.style.display =
    'none';


  const values = {

    action:
      'saveAttendance',

    requestId:
      requestId,

    actionType:
      mode,

    idToken:
      idToken,

    latitude:
      locationData.latitude,

    longitude:
      locationData.longitude,

    accuracy:
      locationData.accuracy,

    imageDataUrl:
      imageData

  };


  Object
  .entries(
    values
  )
  .forEach(

    ([key,value]) => {

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        key;


      input.value =
        String(
          value
        );


      form.appendChild(
        input
      );

    }

  );


  document.body
  .appendChild(
    form
  );


  form.submit();


  setTimeout(
    () => form.remove(),
    5000
  );

}



/*************************************************
 * RESULT POLLING
 *************************************************/

async function waitForResult(
  requestId
){

  const start =
    Date.now();


  while(
    Date.now() -
    start <
    30000
  ){

    await wait(
      700
    );


    const result =
      await jsonp({

        action:
          'result',

        requestId:
          requestId

      });


    if(
      !result.pending
    ){

      return result;

    }

  }


  throw new Error(
    'ระบบใช้เวลาบันทึกนานเกินไป กรุณาลองใหม่'
  );

}



/*************************************************
 * FLEX
 *************************************************/

async function sendFlex(
  result
){

  if(
    !liff.isInClient()
  ){

    throw new Error(
      'บันทึกสำเร็จ แต่ต้องเปิดผ่านแอป LINE เพื่อส่ง Flex'
    );

  }


  const isCheckout =
    result.actionType ===
    'checkout';


  const name =
    result.name ||
    profile.displayName ||
    'พนักงาน';


  const accent1 =
    isCheckout

    ? '#1B1026'

    : '#091F19';


  const accent2 =
    isCheckout

    ? '#5C174B'

    : '#0B5D46';


  const accent3 =
    isCheckout

    ? '#B81746'

    : '#18A974';


  const body = [

    {

      type:'text',

      text:name,

      size:'xl',

      weight:'bold',

      color:'#111111',

      wrap:true

    },

    {

      type:'separator',

      margin:'lg',

      color:'#EEEEEE'

    }

  ];



  /***********************************************
   * CHECK IN
   ***********************************************/

  if(
    !isCheckout
  ){

    body.push(

      flexRow(
        'วันที่',
        result.date
      ),

      flexRow(
        'เวลาเข้า',
        result.checkInTime
      ),

      {

        type:'box',

        layout:'horizontal',

        margin:'lg',

        paddingAll:'14px',

        cornerRadius:'15px',

        backgroundColor:'#EAF9F3',

        contents:[

          {

            type:'text',

            text:'✓',

            color:'#18A974',

            size:'lg',

            weight:'bold',

            flex:0

          },

          {

            type:'text',

            text:'ลงเวลาเข้างานเรียบร้อย',

            color:'#14815B',

            weight:'bold',

            size:'sm',

            margin:'md',

            flex:1

          }

        ]

      }

    );

  }



  /***********************************************
   * CHECK OUT
   ***********************************************/

  else{

    body.push(

      flexRow(
        'เวลาเข้า',
        result.checkInTime
      ),

      flexRow(
        'เวลาออก',
        result.checkOutTime
      ),

      {

        type:'separator',

        margin:'lg',

        color:'#EEEEEE'

      },

      {

        type:'box',

        layout:'vertical',

        margin:'lg',

        paddingAll:'18px',

        cornerRadius:'18px',

        backgroundColor:'#F8EDF2',

        contents:[

          {

            type:'text',

            text:'WORK SUMMARY',

            size:'xs',

            weight:'bold',

            color:'#A35270',

            align:'center'

          },

          {

/*************************************************
 * JSONP
 *************************************************/

function jsonp(
  params
){

  return new Promise(

    (
      resolve,
      reject
    ) => {


      const callback =

        '__slay_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() *
          999999
        );


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams({

          ...params,

          callback:
            callback,

          _:Date.now()

        });


      const timer =
        setTimeout(

          () => {

            cleanup();

            reject(
              new Error(
                'เชื่อมต่อระบบไม่ได้'
              )
            );

          },

          15000

        );


      function cleanup(){

        clearTimeout(
          timer
        );


        try{
          script.remove();
        }
        catch(e){}


        try{
          delete window[
            callback
          ];
        }
        catch(e){}

      }


      window[
        callback
      ] = result => {

        cleanup();

        resolve(
          result
        );

      };


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              'เรียกข้อมูลจากระบบไม่สำเร็จ'
            )
          );

        };


      script.src =

        GAS_URL +

        '?' +

        query.toString();


      document.body
        .appendChild(
          script
        );

    }

  );

}



/*************************************************
 * PHOTO
 *************************************************/

function compressImage(
  file
){

  return new Promise(

    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      const image =
        new Image();


      reader.onload =
        event => {

          image.onload =
            () => {

              let width =
                image.naturalWidth;


              let height =
                image.naturalHeight;


              const maxSide =
                900;


              const scale =
                Math.min(

                  1,

                  maxSide /

                  Math.max(
                    width,
                    height
                  )

                );


              width =
                Math.round(
                  width *
                  scale
                );


              height =
                Math.round(
                  height *
                  scale
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;


              canvas.height =
                height;


              canvas
                .getContext(
                  '2d'
                )
                .drawImage(

                  image,

                  0,

                  0,

                  width,

                  height

                );


              resolve(

                canvas.toDataURL(
                  'image/jpeg',
                  .62
                )

              );

            };


          image.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }

  );

}



/*************************************************
 * DISTANCE
 *************************************************/

function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R =
    6371000;


  const rad =
    d =>
      d *
      Math.PI /
      180;


  const p1 =
    rad(lat1);


  const p2 =
    rad(lat2);


  const dp =
    rad(
      lat2 -
      lat1
    );


  const dl =
    rad(
      lng2 -
      lng1
    );


  const a =

    Math.sin(
      dp /
      2
    ) ** 2

    +

    Math.cos(p1)

    *

    Math.cos(p2)

    *

    Math.sin(
      dl /
      2
    ) ** 2;


  return (

    R *

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    )

  );

}
