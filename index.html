<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#111111">

  <title>เช็คชื่อเข้างาน | SLAY ROIET</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --bg:#f5f5f5;
      --card:#ffffff;
      --text:#111111;
      --muted:#777777;
      --green:#19a974;
      --red:#b81746;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
    }

    body{
      background:var(--bg);
      color:var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      min-height:100vh;
    }

    .wrap{
      max-width:560px;
      margin:0 auto;
      padding:16px 14px 40px;
    }

    .header{
      background:#111111;
      color:#ffffff;

      border-radius:26px;
      padding:23px;

      box-shadow:
        0 14px 35px
        rgba(0,0,0,.13);
    }

    .eyebrow{
      color:#ff7299;
      font-size:11px;
      letter-spacing:1.8px;
      font-weight:900;
    }

    h1{
      margin:6px 0 5px;
      font-size:29px;
      line-height:1.15;
    }

    .subtitle{
      color:#bbbbbb;
      font-size:13px;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:13px;
      margin-top:21px;
    }

    .avatar{
      width:52px;
      height:52px;
      border-radius:50%;
      background:#333333;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.15);
    }

    .profile-name{
      font-size:17px;
      font-weight:900;
    }

    .profile-state{
      margin-top:4px;
      font-size:12px;
      color:#aaaaaa;
    }

    .card{
      margin-top:14px;
      padding:18px;
      background:#ffffff;
      border-radius:23px;

      box-shadow:
        0 7px 26px
        rgba(0,0,0,.05);
    }

    .card-title{
      font-size:18px;
      font-weight:900;
      margin-bottom:14px;
    }

    .gps-box{
      display:flex;
      align-items:center;
      gap:12px;

      border:
        1px solid
        #e8e8e8;

      border-radius:17px;
      padding:14px;
    }

    .gps-icon{
      width:44px;
      height:44px;
      flex:0 0 44px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;
      background:#eaf9f3;
      font-size:22px;
    }

    .gps-title{
      font-size:14px;
      font-weight:900;
    }

    .gps-detail{
      margin-top:4px;
      color:#777777;
      font-size:11px;
      line-height:1.45;
      overflow-wrap:anywhere;
    }

    .distance{
      margin-top:10px;
      font-size:12px;
      line-height:1.45;
    }

    .distance.ok{
      color:#14815b;
      font-weight:800;
    }

    .distance.bad{
      color:#c42026;
      font-weight:800;
    }

    button{
      font-family:inherit;
    }

    .btn{
      width:100%;
      border:0;
      border-radius:16px;
      padding:15px;

      cursor:pointer;

      font-size:15px;
      font-weight:900;
    }

    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .location-btn{
      margin-top:12px;
      background:#eeeeee;
      color:#111111;
    }

    .photo-box{
      position:relative;

      width:100%;
      aspect-ratio:4 / 3;

      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:20px;
      background:#eeeeee;

      border:
        1px dashed
        #cccccc;
    }

    .photo-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .photo-placeholder{
      text-align:center;
      color:#777777;
      font-size:14px;
      line-height:1.6;
    }

    .camera-button{
      display:block;
      margin-top:12px;
      padding:15px;

      text-align:center;

      background:#111111;
      color:#ffffff;

      border-radius:16px;

      font-size:16px;
      font-weight:900;

      cursor:pointer;
    }

    input[type=file]{
      display:none;
    }

    .note{
      margin-top:9px;
      color:#999999;
      font-size:11px;
      line-height:1.5;
    }

    .checkin-btn{
      margin-top:15px;

      padding:18px;

      color:#ffffff;
      background:var(--green);

      font-size:18px;

      border-radius:20px;

      box-shadow:
        0 11px 24px
        rgba(25,169,116,.22);
    }

    .message{
      display:none;
      margin-top:13px;
      padding:14px;
      border-radius:17px;

      font-size:14px;
      line-height:1.55;
      font-weight:800;
    }

    .message.ok{
      display:block;
      color:#117653;
      background:#eaf9f3;
    }

    .message.error{
      display:block;
      color:#bd1f26;
      background:#fff0f0;
    }

    .loading{
      display:none;

      position:fixed;
      inset:0;

      z-index:99999;

      align-items:center;
      justify-content:center;

      padding:30px;

      text-align:center;

      background:
        rgba(255,255,255,.93);
    }

    .loading.show{
      display:flex;
    }

    .loading-card{
      min-width:220px;

      padding:27px;

      border-radius:25px;

      background:#ffffff;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.16);
    }

    .spinner{
      width:45px;
      height:45px;

      margin:
        0 auto
        15px;

      border:
        4px solid
        #eeeeee;

      border-top-color:#b81746;

      border-radius:50%;

      animation:
        spin
        .8s
        linear
        infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <section class="header">

    <div class="eyebrow">
      SLAY ROIET · STAFF ATTENDANCE
    </div>

    <h1>
      เช็คชื่อเข้างาน
    </h1>

    <div class="subtitle">
      ยืนยันด้วย LINE + พิกัด + รูปถ่ายปัจจุบัน
    </div>

    <div class="profile">

      <img
        id="avatar"
        class="avatar"
        alt=""
      >

      <div>

        <div
          id="displayName"
          class="profile-name"
        >
          กำลังเชื่อมต่อ LINE...
        </div>

        <div
          id="lineState"
          class="profile-state"
        >
          กรุณารอสักครู่
        </div>

      </div>

    </div>

  </section>


  <section class="card">

    <div class="card-title">
      1. พิกัดปัจจุบัน
    </div>

    <div class="gps-box">

      <div class="gps-icon">
        ⌖
      </div>

      <div>

        <div
          id="gpsTitle"
          class="gps-title"
        >
          ยังไม่ได้รับพิกัด
        </div>

        <div
          id="gpsDetail"
          class="gps-detail"
        >
          กรุณาอนุญาต Location
        </div>

      </div>

    </div>

    <button
      id="locationBtn"
      class="btn location-btn"
      onclick="getLocation()"
    >
      📍 ใช้พิกัดปัจจุบัน
    </button>

    <div
      id="distanceText"
      class="distance"
    ></div>

  </section>


  <section class="card">

    <div class="card-title">
      2. ถ่ายรูปยืนยัน
    </div>

    <div class="photo-box">

      <div
        id="photoPlaceholder"
        class="photo-placeholder"
      >
        📷
        <br>
        ยังไม่มีรูปถ่าย
      </div>

      <img
        id="photoPreview"
        alt="รูปเช็คอิน"
      >

    </div>

    <label
      for="cameraInput"
      class="camera-button"
    >
      เปิดกล้องถ่ายรูป
    </label>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <div class="note">
      กรุณาถ่ายรูปปัจจุบันก่อนกดเช็คอิน
    </div>

  </section>


  <button
    id="checkinBtn"
    class="btn checkin-btn"
    onclick="submitCheckin()"
    disabled
  >
    ✅ เช็คอินเข้างาน
  </button>

  <div
    id="message"
    class="message"
  ></div>

</div>


<div
  id="loading"
  class="loading"
>

  <div class="loading-card">

    <div class="spinner"></div>

    <div
      id="loadingTitle"
      style="
        font-size:17px;
        font-weight:900;
      "
    >
      กำลังบันทึกเช็คอิน...
    </div>

    <div
      id="loadingDetail"
      style="
        margin-top:6px;
        color:#777;
        font-size:12px;
      "
    >
      กรุณาอย่าปิดหน้านี้
    </div>

  </div>

</div>


<iframe
  id="gasFrame"
  name="gasFrame"
  style="display:none"
></iframe>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const LIFF_ID =
  '2009168820-J1uzUVLZ';

const GAS_WEB_APP_URL =
  'https://script.google.com/macros/s/AKfycbzMf1s3RGCWeJpA-LjX5EmjfE47WSylj1dCTkG7MFdv7Ta_7iZ19lWXENRqnZ-Guc4/exec';

const CHECKIN_LIFF_URL =
  'https://liff.line.me/2009168820-J1uzUVLZ';


/*************************************************
 * SLAY ROIET
 *************************************************/

const OFFICE_LAT =
  16.0680965;

const OFFICE_LNG =
  103.6506075;

const MAX_DISTANCE_M =
  200;


/*************************************************
 * STATE
 *************************************************/

let idToken =
  '';

let lineProfile =
  null;

let currentLocation =
  null;

let compressedImage =
  '';

let submitted =
  false;

const $ =
  id =>
    document.getElementById(id);


/*************************************************
 * START
 *************************************************/

window.addEventListener(
  'load',
  initLiff
);


/*************************************************
 * LIFF
 *************************************************/

async function initLiff(){

  try{

    $('lineState').textContent =
      'กำลังเชื่อมต่อ LINE...';

    await liff.init({
      liffId:LIFF_ID
    });

    if(
      !liff.isLoggedIn()
    ){

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }

    idToken =
      liff.getIDToken();

    if(
      !idToken
    ){

      throw new Error(
        'ไม่ได้รับ ID Token กรุณาตรวจ Scope openid'
      );

    }

    lineProfile =
      await liff.getProfile();

    $('displayName').textContent =
      lineProfile.displayName ||
      'LINE User';

    $('lineState').textContent =
      'เชื่อมต่อ LINE สำเร็จ ✓';

    if(
      lineProfile.pictureUrl
    ){

      $('avatar').src =
        lineProfile.pictureUrl;

    }

    clearMessage();

    getLocation();

    updateButton();

  }
  catch(error){

    console.error(error);

    $('displayName').textContent =
      'เชื่อมต่อ LINE ไม่สำเร็จ';

    $('lineState').textContent =
      error.message ||
      String(error);

    showError(
      'LIFF ERROR: ' +
      (
        error.message ||
        error
      )
    );

  }

}


/*************************************************
 * LOCATION
 *************************************************/

function getLocation(){

  if(
    !navigator.geolocation
  ){

    showError(
      'อุปกรณ์นี้ไม่รองรับ Location'
    );

    return;

  }

  $('locationBtn').disabled =
    true;

  $('gpsTitle').textContent =
    'กำลังค้นหาพิกัด...';

  $('gpsDetail').textContent =
    'กรุณาอนุญาต Location';

  navigator
  .geolocation
  .getCurrentPosition(

    position => {

      currentLocation = {

        latitude:
          Number(
            position.coords.latitude
          ),

        longitude:
          Number(
            position.coords.longitude
          ),

        accuracy:
          Number(
            position.coords.accuracy ||
            0
          )

      };

      $('gpsTitle').textContent =
        'ได้รับพิกัดแล้ว ✓';

      $('gpsDetail').textContent =

        currentLocation.latitude.toFixed(6)

        + ', '

        + currentLocation.longitude.toFixed(6)

        + ' · แม่นยำประมาณ '

        + Math.round(
            currentLocation.accuracy
          )

        + ' ม.';

      const distance =
        calculateDistance(

          currentLocation.latitude,

          currentLocation.longitude,

          OFFICE_LAT,

          OFFICE_LNG

        );

      if(
        distance <=
        MAX_DISTANCE_M
      ){

        $('distanceText').className =
          'distance ok';

        $('distanceText').textContent =

          '✓ อยู่ในพื้นที่เช็คอิน · ห่างประมาณ '

          + Math.round(distance)

          + ' เมตร';

      }
      else{

        $('distanceText').className =
          'distance bad';

        $('distanceText').textContent =

          '✕ อยู่นอกพื้นที่ · ห่างประมาณ '

          + Math.round(distance)

          + ' เมตร · กำหนดไม่เกิน '

          + MAX_DISTANCE_M

          + ' เมตร';

      }

      $('locationBtn').disabled =
        false;

      updateButton();

    },

    error => {

      $('locationBtn').disabled =
        false;

      $('gpsTitle').textContent =
        'ไม่ได้รับพิกัด';

      showError(
        'ไม่สามารถรับพิกัดได้ กรุณาอนุญาต Location'
      );

    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }

  );

}


/*************************************************
 * CAMERA
 *************************************************/

$('cameraInput')
.addEventListener(

  'change',

  async event => {

    const file =
      event.target.files &&
      event.target.files[0];

    if(!file){
      return;
    }

    try{

      compressedImage =
        await compressImage(
          file,
          1000,
          0.70
        );

      $('photoPreview').src =
        compressedImage;

      $('photoPreview').style.display =
        'block';

      $('photoPlaceholder').style.display =
        'none';

      clearMessage();

      updateButton();

    }
    catch(error){

      console.error(error);

      showError(
        'เตรียมรูปไม่สำเร็จ'
      );

    }

  }

);


/*************************************************
 * SUBMIT
 *************************************************/

async function submitCheckin(){

  clearMessage();

  if(
    submitted
  ){
    return;
  }

  if(
    !idToken
  ){

    showError(
      'ยังไม่ได้ยืนยัน LINE'
    );

    return;

  }

  if(
    !currentLocation
  ){

    showError(
      'กรุณารับพิกัดก่อน'
    );

    return;

  }

  if(
    !compressedImage
  ){

    showError(
      'กรุณาถ่ายรูปก่อน'
    );

    return;

  }

  const distance =
    calculateDistance(

      currentLocation.latitude,

      currentLocation.longitude,

      OFFICE_LAT,

      OFFICE_LNG

    );

  if(
    MAX_DISTANCE_M > 0
    &&
    distance >
    MAX_DISTANCE_M
  ){

    showError(

      'คุณอยู่นอกพื้นที่เช็คอิน (' +

      Math.round(distance) +

      ' เมตร)'

    );

    return;

  }

  submitted =
    true;

  $('checkinBtn').disabled =
    true;

  $('loadingTitle').textContent =
    'กำลังบันทึกเช็คอิน...';

  $('loadingDetail').textContent =
    'กำลังอัปโหลดรูปและบันทึกข้อมูล';

  setLoading(
    true
  );


  /*************************************************
   * SEND TO BACKEND
   *************************************************/

  sendToBackend();


  /*************************************************
   * ไม่รอ postMessage
   *************************************************/

  await wait(
    2500
  );


  /*************************************************
   * SEND FLEX
   *************************************************/

  try{

    $('loadingTitle').textContent =
      'บันทึกเรียบร้อย ✓';

    $('loadingDetail').textContent =
      'กำลังส่ง Flex เข้าแชต...';

    await sendCheckinFlexSimple(
      distance
    );

    $('loadingTitle').textContent =
      'เช็คอินสำเร็จ ✓';

    $('loadingDetail').textContent =
      'กำลังปิดหน้าต่าง...';

    await wait(
      900
    );

    if(
      liff.isInClient()
    ){

      liff.closeWindow();

    }
    else{

      setLoading(
        false
      );

      showSuccess(
        '✅ เช็คอินเรียบร้อยแล้ว'
      );

    }

  }
  catch(error){

    console.error(error);

    submitted =
      false;

    setLoading(
      false
    );

    $('checkinBtn').disabled =
      false;

    showError(

      'บันทึกแล้ว แต่ส่ง Flex ไม่สำเร็จ<br>' +

      (
        error.message ||
        error
      )

    );

  }

}


/*************************************************
 * BACKEND
 *************************************************/

function sendToBackend(){

  const form =
    document.createElement(
      'form'
    );

  form.method =
    'POST';

  form.action =
    GAS_WEB_APP_URL;

  form.target =
    'gasFrame';

  form.style.display =
    'none';

  const data = {

    action:
      'saveAttendance',

    idToken:
      idToken,

    latitude:
      currentLocation.latitude,

    longitude:
      currentLocation.longitude,

    accuracy:
      currentLocation.accuracy,

    imageDataUrl:
      compressedImage

  };

  Object
  .entries(data)
  .forEach(

    ([key,value]) => {

      const input =
        document.createElement(
          'input'
        );

      input.type =
        'hidden';

      input.name =
        key;

      input.value =
        String(value);

      form.appendChild(
        input
      );

    }

  );

  document.body.appendChild(
    form
  );

  form.submit();

  setTimeout(
    () => {

      try{
        form.remove();
      }
      catch(e){}

    },
    5000
  );

}


/*************************************************
 * FLEX
 *************************************************/

async function sendCheckinFlexSimple(
  distance
){

  if(
    !liff.isInClient()
  ){

    throw new Error(
      'ต้องเปิดระบบผ่านแอป LINE'
    );

  }

  const now =
    new Date();

  const date =
    now.toLocaleDateString(
      'th-TH',
      {
        day:'2-digit',
        month:'2-digit',
        year:'numeric'
      }
    );

  const time =
    now.toLocaleTimeString(
      'th-TH',
      {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false
      }
    );

  const name =
    lineProfile &&
    lineProfile.displayName

      ? lineProfile.displayName

      : 'พนักงาน';


  const flex = {

    type:'flex',

    altText:
      '✅ ' +
      name +
      ' เช็คอินเข้างานแล้ว',

    contents:{

      type:'bubble',

      size:'mega',


      header:{

        type:'box',

        layout:'vertical',

        paddingAll:'0px',

        contents:[


          {
            type:'box',

            layout:'vertical',

            backgroundColor:'#260912',

            paddingStart:'20px',

            paddingEnd:'20px',

            paddingTop:'16px',

            paddingBottom:'7px',

            contents:[

              {
                type:'text',

                text:'SLAY ROIET',

                size:'xs',

                weight:'bold',

                color:'#FF6E99'
              }

            ]
          },


          {
            type:'box',

            layout:'horizontal',

            backgroundColor:'#67112E',

            paddingStart:'20px',

            paddingEnd:'20px',

            paddingTop:'5px',

            paddingBottom:'7px',

            contents:[

              {
                type:'text',

                text:'CHECK IN',

                size:'xxl',

                weight:'bold',

                color:'#FFFFFF',

                flex:1
              },

              {
                type:'text',

                text:'✓',

                size:'xl',

                weight:'bold',

                color:'#FFFFFF',

                align:'end'
              }

            ]
          },


          {
            type:'box',

            layout:'vertical',

            backgroundColor:'#B81746',

            paddingStart:'20px',

            paddingEnd:'20px',

            paddingTop:'7px',

            paddingBottom:'14px',

            contents:[

              {
                type:'text',

                text:'STAFF ATTENDANCE · SUCCESS',

                size:'xs',

                weight:'bold',

                color:'#FFD5E2'
              }

            ]
          }

        ]

      },


      body:{

        type:'box',

        layout:'vertical',

        spacing:'md',

        paddingAll:'20px',

        contents:[


          {
            type:'text',

            text:name,

            size:'xl',

            weight:'bold',

            wrap:true
          },


          {
            type:'separator',

            margin:'md'
          },


          modernFlexRow(
            '📅',
            'วันที่',
            date
          ),


          modernFlexRow(
            '🕒',
            'เวลา',
            time
          ),


          modernFlexRow(
            '📍',
            'ระยะจากร้าน',
            Math.round(distance) +
            ' เมตร'
          ),

/*************************************************
 * COMPRESS IMAGE
 *************************************************/

function compressImage(
  file,
  maxSide,
  quality
){

  return new Promise(

    (resolve,reject) => {

      const image =
        new Image();

      const reader =
        new FileReader();

      reader.onload =
        event => {

          image.onload =
            () => {

              let width =
                image.naturalWidth;

              let height =
                image.naturalHeight;

              const scale =
                Math.min(
                  1,
                  maxSide /
                  Math.max(
                    width,
                    height
                  )
                );

              width =
                Math.round(
                  width *
                  scale
                );

              height =
                Math.round(
                  height *
                  scale
                );

              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const context =
                canvas.getContext(
                  '2d'
                );

              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );

              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  quality
                )
              );

            };

          image.onerror =
            () => {

              reject(
                new Error(
                  'อ่านรูปไม่ได้'
                )
              );

            };

          image.src =
            event.target.result;

        };

      reader.onerror =
        () => {

          reject(
            new Error(
              'อ่านไฟล์ไม่ได้'
            )
          );

        };

      reader.readAsDataURL(
        file
      );

    }

  );

}


/*************************************************
 * DISTANCE
 *************************************************/

function calculateDistance(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R =
    6371000;

  const rad =
    value =>
      Number(value) *
      Math.PI /
      180;

  const p1 =
    rad(lat1);

  const p2 =
    rad(lat2);

  const deltaLat =
    rad(
      Number(lat2) -
      Number(lat1)
    );

  const deltaLng =
    rad(
      Number(lng2) -
      Number(lng1)
    );

  const a =

    Math.sin(
      deltaLat / 2
    ) ** 2

    +

    Math.cos(p1)

    *

    Math.cos(p2)

    *

    Math.sin(
      deltaLng / 2
    ) ** 2;

  return (

    R *

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    )

  );

}

    resolve =>
      setTimeout(

        ms

  );

}
